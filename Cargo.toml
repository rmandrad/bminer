[workspace]
resolver = "2"
members = [
    "crates/bminer-core",
    "crates/bminer-cuda",
    "crates/bminer-pool",
    "crates/bminer-monitor",
    "crates/bminer-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["BMiner Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourusername/bminer"
rust-version = "1.75"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"

# CUDA bindings
cudarc = { version = "0.11", features = ["cuda-12050"] }

# Cryptography
sha2 = "0.10"
hex = "0.4"

# Networking
tokio-tungstenite = "0.23"
serde_json = "1.0"

# Configuration
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
config = "0.14"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# System monitoring
sysinfo = "0.31"
nvml-wrapper = "0.10"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Utilities
bytes = "1.7"
futures = "0.3"

# Testing
criterion = "0.5"
mockall = "0.13"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true