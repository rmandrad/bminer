# BMiner Configuration for Braiins Pool Solo Mining Test
# Based on: https://academy.braiins.com/en/braiins-pool/solo-mining/

[pool]
# Braiins Pool Stratum V1 endpoint for solo mining
url = "stratum+tcp://stratum.braiins.com:25"
# Your Bitcoin wallet address (REPLACE WITH YOUR ADDRESS)
# This is where block rewards will be sent if you find a block
username = "bc1quel00mg42nlsp083c3kjf30v0ttszpfnlmp7gs"

# Password is typically "x" for most pools
password = "x"

# Worker name for identification in pool dashboard
worker_name = "bminer-rmandrad"

[gpu]
# Use all available GPUs (empty array = all GPUs)
# Or specify: devices = [0] to use only GPU 0
devices = [0]

# Mining intensity (1-10)
# Start with 5 for testing, increase if stable
intensity = 5

# Maximum GPU temperature (Celsius)
# Mining will pause if exceeded
max_temperature = 80

# Maximum power usage (watts, 0 = no limit)
max_power = 0

# CUDA kernel parameters (leave as default for now)
threads_per_block = 256
blocks_per_grid = 1024

[idle]
# Disable idle detection for testing (mine continuously)
enabled = false

# CPU usage threshold (percentage)
cpu_threshold = 20.0

# Minimum idle duration before mining (seconds)
min_idle_duration = 60

# Check interval (seconds)
check_interval = 5

# GPU utilization threshold (percentage)
gpu_threshold = 10

[monitoring]
# Enable performance monitoring
enabled = true

# Statistics update interval (seconds)
stats_interval = 30

# Web dashboard (not yet implemented)
web_dashboard = false
web_port = 8080

[logging]
# Log level for testing (use "debug" for more details)
level = "info"

# Log to file (optional)
# file = "/tmp/bminer-test.log"

# Log to console
console = true

# Use JSON format for logs
json = false